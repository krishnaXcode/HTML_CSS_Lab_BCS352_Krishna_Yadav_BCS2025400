<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Accessible Marks Table - Krishna Yadav</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 350px; }
        caption { font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; text-align: left; }
        th, td { border: 1px solid #64748b; padding: 10px 14px; text-align: center; }
        thead th { background-color: #1e3a8a; color: white; }
        th[scope="row"] { background-color: #f1f5f9; text-align: left; font-weight: bold; }
    </style>
</head>
<body>
    <table>
        <caption>Marks of Class A</caption>
        <thead>
            <tr>
                <th scope="col">Name</th>
                <th scope="col">Maths</th>
                <th scope="col">Science</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="row">Krishna Yadav</th>
                <td>78</td>
                <td>85</td>
            </tr>
            <tr>
                <th scope="row">Rohan</th>
                <td>64</td>
                <td>70</td>
            </tr>
        </tbody>
    </table>

    <footer style="margin-top: 40px; padding: 12px 16px; background-color: #f1f5f9; border-top: 2px solid #cbd5e1; font-family: sans-serif; font-size: 13px; color: #475569; border-radius: 6px;">

</body>
