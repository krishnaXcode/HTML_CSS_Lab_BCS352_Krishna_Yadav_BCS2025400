<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image - Krishna Yadav</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .image-container {
            max-width: 500px;
            border: 2px dashed #3b82f6;
            padding: 12px;
            border-radius: 8px;
        }
        img {
            max-width: 100%;
            height: auto;
            display: block;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <h1>Responsive Picture Scaling</h1>
    <div class="image-container">
        <img src="images/profile.png" alt="Responsive profile banner of Krishna Yadav">
    </div>
    <p>This image scales fluidly using <code>max-width: 100%; height: auto;</code> so it never overflows narrow screens.</p>
