<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flexbox Navigation - Krishna Yadav</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        nav {
            display: flex;
            background-color: #0f172a;
            padding: 16px 24px;
            gap: 24px;
        }
        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: color 0.2s;
        }
        nav a:hover {
            color: #38bdf8;
        }
    </style>
</head>
<body>
    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#events">Events</a>
        <a href="#contact">Contact</a>
    </nav>
    <div style="padding: 20px;">
        <h2>Horizontal Flexbox Navigation Bar</h2>
        <p>This navigation bar uses <code>display: flex</code> with white links on a dark slate background.</p>
    </div>

    <footer style="margin-top: 40px; padding: 12px 16px; background-color: #f1f5f9; border-top: 2px solid #cbd5e1; font-family: sans-serif; font-size: 13px; color: #475569; border-radius: 6px;">
