<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Centred Cards - Krishna Yadav</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f8fafc; }
        .row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 250px;
            background-color: #e2e8f0;
            padding: 20px;
            border-radius: 8px;
        }
        .card {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 20px;
            width: 180px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .card h3 {
            margin-top: 0;
            color: #1e3a8a;
        }
        .price {
            font-size: 24px;
            font-weight: bold;
            color: #059669;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Subscription Pricing Plans</h1>
    <div class="row">
        <div class="card">
            <h3>Starter</h3>
            <p class="price">199</p>
        </div>
        <div class="card">
            <h3>Standard</h3>
            <p class="price">349</p>
        </div>
        <div class="card">
            <h3>Premium</h3>
            <p class="price">499</p>
        </div>
    </div>

    <footer style="margin-top: 40px; padding: 12px 16px; background-color: #f1f5f9; border-top: 2px solid #cbd5e1; font-family: sans-serif; font-size: 13px; color: #475569; border-radius: 6px;">

        <strong>Roll Number:</strong> BCS2025400 &nbsp;|&nbsp; 
        <strong>Course:</strong> B.Tech CSE - 3rd Semester &nbsp;|&nbsp; 
        <strong>Subject:</strong> HTML and CSS Introduction Lab (BCS352)
    </footer>
</body>
</html>
