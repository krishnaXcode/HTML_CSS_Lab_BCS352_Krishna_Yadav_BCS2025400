<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wrapping Cards - Krishna Yadav</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .catalog {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            padding: 10px 0;
        }
        .item-card {
            background-color: #f1f5f9;
            border: 1px solid #94a3b8;
            border-radius: 8px;
            padding: 18px;
            width: 180px;
            text-align: center;
        }
        .item-card h3 {
            margin: 0 0 10px 0;
            color: #0f172a;
        }
        .price-tag {
            color: #b91c1c;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1>Stationery Shop</h1>
    <div class="catalog">
        <div class="item-card">
            <h3>Notebook</h3>
            <p class="price-tag">Price: 60</p>
        </div>
        <div class="item-card">
            <h3>Pen</h3>
            <p class="price-tag">Price: 15</p>
        </div>
        <div class="item-card">
            <h3>Bag</h3>
            <p class="price-tag">Price: 350</p>
        </div>
        <div class="item-card">
            <h3>Book</h3>
            <p class="price-tag">Price: 120</p>
        </div>
    </div>

    <footer style="margin-top: 40px; padding: 12px 16px; background-color: #f1f5f9; border-top: 2px solid #cbd5e1; font-family: sans-serif; font-size: 13px; color: #475569; border-radius: 6px;">

        <strong>Course:</strong> B.Tech CSE - 3rd Semester &nbsp;|&nbsp; 
        <strong>Subject:</strong> HTML and CSS Introduction Lab (BCS352)
    </footer>
</body>
</html>
