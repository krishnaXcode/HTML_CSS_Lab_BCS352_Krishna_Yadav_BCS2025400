<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Photo Gallery - Krishna Yadav</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }
        .photo-box {
            background-color: #10b981;
            color: white;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 120px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>Club Photo Gallery</h1>
    <div class="gallery-grid">
        <div class="photo-box">Photo 1</div>
        <div class="photo-box">Photo 2</div>
        <div class="photo-box">Photo 3</div>
        <div class="photo-box">Photo 4</div>
        <div class="photo-box">Photo 5</div>
        <div class="photo-box">Photo 6</div>
    </div>

    <footer style="margin-top: 40px; padding: 12px 16px; background-color: #f1f5f9; border-top: 2px solid #cbd5e1; font-family: sans-serif; font-size: 13px; color: #475569; border-radius: 6px;">

    </footer>
</body>
