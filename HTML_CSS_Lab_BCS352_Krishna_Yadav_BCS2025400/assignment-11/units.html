<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Units - Krishna Yadav</title>
    <style>
        .box-px {
            width: 200px;
            height: 40px;
            background-color: #60a5fa;
            color: #1e3a8a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .box-percent {
            width: 50%;
            height: 40px;
            background-color: #34d399;
            color: #064e3b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .rem-text {
            font-size: 1.5rem;
            color: #334155;
        }
    </style>
</head>
<body>
    <h1>Demonstrating CSS Units: px, % and rem</h1>
    <div class="box-px">200px Wide Box</div>
    <div class="box-percent">50% Wide Box</div>
    <p class="rem-text">This paragraph is styled with a responsive font size of 1.5rem.</p>
